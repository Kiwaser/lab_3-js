<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>StarTreck</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div id="start-screen" class="start-screen">
    <h1 class="game-name">StarTreck</h1>
    <form id="start-form">
        <input id="name-input" type="text" placeholder="Введите своё имя" maxlength="20">
        <button id="start-btn" type="submit" disabled>Начать игру</button>
    </form>
</div>

<div id="game-screen" class="game-screen">
    <div class="hud">
        <div id="hud-timer">02:00</div>
        <button id="pause-btn" type="button">Пауза</button>
        <div id="hud-score">Баллы: 0</div>
        <div id="hud-lives">Жизни: 3</div>
        <div id="hud-name">Игрок</div>
    </div>
    <div class="canvas-wrap">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <div id="pause-overlay" class="pause-overlay">
            <span>Пауза</span>
        </div>
    </div>
</div>

<div id="game-over-screen" class="game-over-screen">
    <h1>Game Over</h1>
    <p id="player-result"></p>
    <table id="results-table">
        <thead>
        <tr>
            <th>#</th>
            <th>Игрок</th>
            <th>Баллы</th>
        </tr>
        </thead>
        <tbody id="results-body"></tbody>
    </table>
    <button id="restart-btn" type="button">Играть снова</button>
</div>
</body>
</html>
