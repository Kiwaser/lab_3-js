<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>StarTreck</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div id="start-screen" class="start-screen">
    <h1 class="game-name">StarTreck</h1>
    <form id="start-form">
        <input id="name-input" type="text" placeholder="Введите своё имя" maxlength="20">
        <button id="start-btn" type="submit" disabled>Начать</button>
    </form>
</div>

<div id="game-screen" class="game-screen">
    <p>time</p>
    <p>points</p>
    <p>Nickname</p>
    <div class="canvas"></div>
</div>

<div id="game-over-screen" class="game-over-screen">
    <H1>Game Over</H1>
    <table>
<!--        Таблица-->
    </table>
</div>
</body>
</html>
